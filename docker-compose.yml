version: '3.8'

services:
  bot:
    image: node:20-bookworm
    container_name: xforward-bot
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: bash -c "apt-get update && apt-get install -y ffmpeg python3 && npm install && npm start"
    restart: unless-stopped
